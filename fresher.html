<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fresher Application</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="src/css/fresher.css" />
</head>
<body>
  <div class="page">
    <div class="header">
      <a href="fresher.html" class="nav-tab active">🎓 Fresher</a>
      <a href="experience.html" class="nav-tab">💼 Experienced</a>
    </div>

    <div class="forming">
      <div class="progress-container">
  <div class="progress-text">0% Completed</div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

      <div class="form-header">
        <h2>🎓 Fresher Application</h2>
        <p>Please fill out all required fields.</p>
      </div>

      <form id="fresherForm" onsubmit="return validateFresherForm()">
        <h3>📄 Personal Details</h3>
        <label>Full Name <span class="required">*</span>
          <input type="text" id="fullName" required />
        </label>
        <label>Phone No <span class="required">*</span>
          <input type="text" id="phone"  required />
        </label>
        <label>Email <span class="required">*</span>
          <input type="email" id="email" required />
        </label>
        <label>Aadhar No <span class="required">*</span>
          <input type="text" id="aadhar" required />
        </label>
        <label>PAN No <span class="required">*</span>
            <span class="tooltip">[Format: ABCDE1234F]</span>
          <input type="text" id="pan" required />
        </label>

        <h3>🎓 Education Details</h3>
        <label>10th School Name <span class="required">*</span>
          
          <input type="text" required />
        </label>
        <label>10th Certificate <span class="required">*</span>
          <span class="tooltip">[PDF or DOC]</span>
          <input type="file" id="cert10" accept=".pdf,.doc"    required/>
        </label>
        <label> Inter College Name <span c lass="required">*</span>
          
          <input type="text" required />
        </label>
        <label>Inter Certificate <span class="required">*</span>
          <span class="tooltip">[PDF or DOC]</span>
          <input type="file" id="certInter" accept=".pdf,.doc" required />
        </label>
        <label>Degree College Name <span class="required">*</span>
          
          <input type="text" required />
        </label>
        <label>Degree Certificate <span class="required">*</span>
          <span class="tooltip">[PDF or DOC]</span>
          <input type="file" id="certDegree" accept=".pdf,.doc" required />
        </label>

        <button type="submit">Submit</button>
        <div id="success-msg">✅ Thank you! Form submitted successfully.</div>
      </form>
    </div>
  </div>

<script>
  function validateFresherForm() {
    let errors = [];
    const errorFields = [];
    document.querySelectorAll("input").forEach(input => input.classList.remove("error"));

    const email = document.getElementById("email");
    const phone = document.getElementById("phone");
    const aadhar = document.getElementById("aadhar");
    const pan = document.getElementById("pan");
    const cert10 = document.getElementById("cert10");
    const certInter = document.getElementById("certInter");
    const certDegree = document.getElementById("certDegree");

    if (!email.value.endsWith("@gmail.com")) {
      errors.push("Email must be a valid @gmail.com address.");
      errorFields.push(email);
    }

    if (!/^\d{10}$/.test(phone.value)) {
      errors.push("Phone number must be 10 digits.");
      errorFields.push(phone);
    }

    if (!/^\d{12}$/.test(aadhar.value)) {
      errors.push("Aadhar number must be 12 digits.");
      errorFields.push(aadhar);
    }
if (!/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(pan.value)) {
  errors.push("PAN number must be in format: 5 letters, 4 digits, 1 letter (e.g., ABCDE1234F).");
  errorFields.push(pan);
}

    [cert10, certInter, certDegree].forEach((fileInput, i) => {
      const labels = ["10th Certificate", "Inter Certificate", "Degree Certificate"];
      if (!fileInput.files[0] || !/\.(pdf|doc)$/i.test(fileInput.files[0].name)) {
        errors.push(`${labels[i]} must be a valid PDF or DOC.`);
        errorFields.push(fileInput);
      }
    });

    errorFields.forEach(f => f.classList.add("error"));

    if (errors.length > 0) {
      alert("🔴 Please fix:\n- " + errors.join("\n- "));
      return false;
    }

    document.getElementById("success-msg").style.display = "block";
    return false;
  }
  document.querySelectorAll("input").forEach(input => {
  input.addEventListener("input", updateProgress);
});

function updateProgress() {
  const inputs = Array.from(document.querySelectorAll("input[type='text'], input[type='email'], input[type='file']"));
  let filled = 0;

  inputs.forEach(input => {
    if (
      (input.type === "file" && input.files.length > 0) ||
      (input.type !== "file" && input.value.trim() !== "")
    ) {
      filled++;
    }
  });

  const percent = Math.round((filled / inputs.length) * 100);
  document.getElementById("progressFill").style.width = percent + "%";
  document.querySelector(".progress-text").textContent = percent + "% Completed";
}

</script>
</body>
</html>
