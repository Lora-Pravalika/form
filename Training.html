<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Training Details</title>
  <link rel="stylesheet" href="src/css/training.css" />
</head>
<body>
  <div class="trainPage">
    <h2> Training Details Form</h2>

    <form id="trainingForm" onsubmit="return validateTrainingForm()">

      <label>Employee Name 
        <input type="text" id="employeeName" required />
      </label>

      <label>Provider 
        <input type="text" id="provider" required />
      </label>

      <label>Date Completed 
        <input type="date" id="dateCompleted" required />
      </label>

      <label>Skills </label>
      <div class="tag-input" id="tagInputBox">
        <input type="text" id="skillInput" placeholder="Type and press Enter..." />
      </div>

      <label>Certificate 
        <span class="tooltip">[PDF or DOC]</span>
        <input type="file" id="certificate" accept=".pdf,.doc" required />
      </label>

      <button type="submit">Submit</button>
      <div id="success-msg">✅ Submitted Successfully</div>
    </form>
  </div>

<script>
  const input = document.getElementById("skillInput");
  const tagInputBox = document.getElementById("tagInputBox");
  let skillCount = 0;

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === ",") {
      e.preventDefault();
      const value = input.value.trim().replace(",", "");
      if (value) {
        addTag(value);
        input.value = "";
      }
    }
  });

  function addTag(text) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.innerHTML = `${text} <span class="remove-tag" onclick="removeTag(this)">×</span>`;
    tagInputBox.insertBefore(tag, input);
    skillCount++;
  }

  function removeTag(element) {
    tagInputBox.removeChild(element.parentElement);
    skillCount--;
  }

  function validateTrainingForm() {
    const employee = document.getElementById("employeeName");
    const provider = document.getElementById("provider");
    const dateCompleted = document.getElementById("dateCompleted");
    const certificate = document.getElementById("certificate");

    let errors = [];



    

    if (skillCount < 1) {
      errors.push("Please enter at least one skill.");
    }

    if (!certificate.files[0] || !/\.(pdf|doc)$/i.test(certificate.files[0].name)) {
      errors.push("Certificate must be a valid PDF or DOC file.");
    }

    if (errors.length > 0) {
      alert("🔴 Please fix:\n- " + errors.join("\n- "));
      return false;
    }

    document.getElementById("success-msg").style.display = "block";
    return false;
  }
</script>
</body>
</html>
