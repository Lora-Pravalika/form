<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Job Application Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="src/css/form.css" />
</head>
<body>

  <div class="form-container">
    <h2>✨ Apply for Your Dream Job</h2>

    <form id="jobForm" novalidate>
      <div class="form-group">
        <label for="name">Full Name <span class="required">*</span></label>
        <input type="text" id="name" placeholder="John Doe" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" placeholder="you@gmail.com" required />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number <span class="required">*</span></label>
        <input type="tel" id="phone" pattern="[0-9]{10}" placeholder="9876543210" required />
      </div>

      <div class="form-group">
        <label for="aadhar">Aadhar Number <span class="required">*</span></label>
        <input type="text" id="aadhar" pattern="\d{12}" placeholder="123456789012" required />
      </div>

      <div class="form-group">
        <label for="pan">PAN Number <span class="required">*</span></label>
        <input type="text" id="pan" pattern="[A-Z]{5}[0-9]{4}[A-Z]" maxlength="10" placeholder="ABCDE1234F" required />
      </div>

      <div class="form-group">
        <label for="resume">Upload Resume(pdf or doc) <span class="required">*</span></label>
        <input type="file" id="resume" accept=".pdf,.doc,.docx" required />
      </div>

      <button type="submit">📤 Submit </button>
    </form>
  </div>

  <script 
  >
document.getElementById("jobForm").addEventListener("submit", function (e) {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const aadhar = document.getElementById("aadhar").value.trim();
  let pan = document.getElementById("pan").value.trim().toUpperCase();
  document.getElementById("pan").value = pan; 

  const resume = document.getElementById("resume").files[0];

  const aadharRegex = /^\d{12}$/;
  const panRegex = /^[A-Z]{5}[0-9]{4}[A-Z]$/;
  const phoneRegex = /^\d{10}$/;
  const emailRegex = /^[\w.-]+@[\w.-]+\.\w{2,}$/;
  const fileExtensionRegex = /\.(pdf|doc|docx)$/i;

  if (!name || !email || !phone || !aadhar || !pan || !resume) {
    alert("⚠️ Please fill in all the fields.");
    return;
  }

  if (!emailRegex.test(email)) {
    alert("📧 Please enter a valid email address.");
    return;
  }

  if (!phoneRegex.test(phone)) {
    alert("📱 Phone number must be exactly 10 digits.");
    return;
  }

  if (!aadharRegex.test(aadhar)) {
    alert("🆔 Aadhar number must be exactly 12 digits.");
    return;
  }

  if (!panRegex.test(pan)) {
    alert("🧾 Invalid PAN number. Format: ABCDE1234F.");
    return;
  }

  if (!fileExtensionRegex.test(resume.name)) {
    alert("📄 Only PDF or Word documents (.pdf, .doc, .docx) are accepted.");
    return;
  }

  alert("🎉 Form submitted successfully!");

});
</script>
</body>
</html>
